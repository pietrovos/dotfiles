include ~/.local/state/omarchy/current/theme/kitty.conf

# Always start zsh for new kitty sessions
shell /bin/zsh

# Font
font_family CaskaydiaMono Nerd Font
bold_italic_font auto
font_size        15

# Window
window_padding_width 0
window_padding_height 0
hide_window_decorations yes
show_window_resize_notification no
confirm_os_window_close 0
background_opacity 0.75
dynamic_background_opacity yes

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
mouse_map left doublepress grabbed,ungrabbed combine : mouse_selection line : copy_to_clipboard : clear_selection
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# Send Ctrl+G through to zsh, which copies the last command block.
map ctrl+shift+g send_text normal,application \x07

# Allow remote access
single_instance yes
# allow_remote_control yes

# Aesthetics
cursor_shape block
enable_audio_bell no

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Allow cwd lookup from global keybindings
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}

# Scrolling (easier to scroll back through long Claude Code / TUI output)
scrollback_lines 20000
wheel_scroll_multiplier 8.0
touch_scroll_multiplier 3.0
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
map shift+home scroll_home
map shift+end scroll_end
