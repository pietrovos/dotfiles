[tools]
bun = "1.3.14"
claude = "latest"
codex = "latest"
gh = "latest"
node = "24.21.0"
# postinstall links the platform binary; mise installs npm packages with scripts disabled.
"npm:@opencode/cli" = { version = "latest", postinstall = "cd \"$MISE_TOOL_INSTALL_PATH/node_modules/@opencode/cli\" && node postinstall.mjs" }

[settings.upgrade]
auto_prune = false

