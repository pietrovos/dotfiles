# The NVIDIA card exposes one HDMI/DP audio output at a time. Prefer the
# LG TV (HDMI 3) and never offer the MSI G274QPX (HDMI 1) as a sink.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_01_00.1"
      }
    ]
    actions = {
      update-props = {
        device.profile = "output:hdmi-stereo-extra2"
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_01_00.1.hdmi-stereo"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
