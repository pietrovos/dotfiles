# Reduce playback level digitally: full-level input produces audible
# distortion on this KT USB adapter even with its hardware volume lowered.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.usb-KTMicro_KT_USB_Audio_2021-06-07-0000-0000-0000--00"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
